<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project map</title>
<style>
  :root { --font: system-ui, "Segoe UI", sans-serif; --mono: ui-monospace, "JetBrains Mono", monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 28px 4px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; letter-spacing: .02em; } .sub { margin: 4px 0 0; font-size: 12px; opacity: .7; }
  #stats { display: flex; gap: 8px; flex-wrap: wrap; } .chip { font: 600 11px var(--font); padding: 5px 10px; border-radius: 999px; letter-spacing: .04em; }
  .chip b { font-weight: 800; } .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .ctl { display: flex; align-items: center; gap: 4px; }
  #search { font: 12px var(--font); padding: 6px 10px; border-radius: 4px; width: 210px; outline: none; border: 1px solid; }
  #search.none { border-color: #ff5c6c !important; }
  .blueprint #search { background: #0f1520; color: #d8e1f0; border-color: #2c3b55; } .blueprint #search:focus { border-color: #4f7cc0; }
  .factory #search { background: #3a3530; color: #e9dfcf; border-color: #5a524a; }
  #hits { font-size: 11px; opacity: .7; min-width: 44px; text-align: right; }
  .node.hit .hitring { opacity: 1; }
  .node.tup .hitring { opacity: 1; stroke: #b48cff; stroke-dasharray: 5 4; } .node.tdown .hitring { opacity: 1; stroke: #3fd9e6; stroke-dasharray: 5 4; }
  .edge.traced path:nth-child(2) { stroke-width: 2.6; stroke-opacity: 1; }
  #hits .up { color: #b48cff; } #hits .down { color: #3fd9e6; }
  @media (max-width: 760px) { #search { width: 150px; } }
  .ctl button { font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; margin-left: 4px;
                border-radius: 4px; cursor: pointer; border: 1px solid; background: transparent; }
  #wrap { position: relative; margin: 0 12px; overflow: hidden; touch-action: none; cursor: grab; border-radius: 8px;
          user-select: none; -webkit-user-select: none; } #wrap.drag { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; }
  #zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  #zoom button { width: 34px; height: 34px; font: 700 16px var(--font); border-radius: 6px; cursor: pointer; padding: 0; }
  .blueprint #zoom button { background: rgba(18,26,41,.92); color: #cfe0ff; border: 1px solid #2c3b55; }
  .factory #zoom button { background: #3a3530; color: #e9dfcf; border: 1px solid #1a1816; }
  #crumbs { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; align-items: center; font-size: 12px; flex-wrap: wrap; max-width: calc(100% - 70px); }
  #crumbs:empty { display: none; }
  #crumbs button { font: 600 12px var(--font); padding: 5px 10px; border-radius: 5px; cursor: pointer; border: 1px solid #2c3b55; background: rgba(18,26,41,.92); color: #9fb6d8; }
  #crumbs b { padding: 5px 10px; border-radius: 5px; background: #1d2b44; color: #fff; border: 1px solid #4f7cc0; }
  #crumbs span { opacity: .5; }
  .node.outside { opacity: .55; }
  .node { cursor: pointer; } .node .selring { opacity: 0; } .node.sel .selring { opacity: 1; }
  #tools { position: absolute; display: none; gap: 4px; padding: 4px; border-radius: 8px; transform: translateX(-50%); z-index: 2;
           background: rgba(14,20,32,.96); border: 1px solid #3a5280; box-shadow: 0 6px 20px rgba(0,0,0,.5); white-space: nowrap; }
  #tools.on { display: flex; }
  #tools button { font: 600 12px var(--font); padding: 7px 12px; border-radius: 5px; cursor: pointer; border: 0; background: transparent; color: #cfe0ff; }
  #tools button:hover, #tools button:focus-visible { background: #1f3354; color: #fff; outline: none; }
  .factory #tools { background: #3a3530; border-color: #1a1816; } .factory #tools button { color: #e9dfcf; }
  .factory #tools button:hover { background: #e39827; color: #1b1712; }
  svg.fade { opacity: 0; } svg { transition: opacity .16s ease; }
  #hint { position: absolute; left: 10px; bottom: 10px; font-size: 11px; pointer-events: none; padding: 3px 8px; border-radius: 4px; background: rgba(10,14,21,.8); color: #8fa3c4; }
  @media (max-width: 900px) { header { padding: 14px 14px 4px; } .legend { padding: 12px 14px 24px; } }
  #drawer { position: absolute; top: 8px; right: 8px; bottom: 8px; width: min(360px, calc(100% - 16px)); z-index: 3; overflow-y: auto;
            border-radius: 10px; padding: 16px 18px 18px; font-size: 13px; line-height: 1.5; cursor: auto; touch-action: pan-y;
            transform: translateX(calc(100% + 24px)); transition: transform .2s ease; user-select: text; -webkit-user-select: text; }
  #drawer.on { transform: none; }
  @media (max-width: 760px) { #drawer { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 64%; border-radius: 14px 14px 0 0;
                              transform: translateY(105%); } }
  #drawer .x { position: sticky; top: 0; float: right; margin: -6px -8px 0 8px; width: 30px; height: 30px; border-radius: 6px; border: 0;
               background: transparent; color: inherit; font-size: 18px; cursor: pointer; opacity: .7; } #drawer .x:hover { opacity: 1; background: rgba(255,255,255,.08); }
  #drawer .kind { font: 700 10.5px var(--font); letter-spacing: .14em; text-transform: uppercase; }
  #drawer h2 { margin: 4px 0 2px; font-size: 17px; } #drawer .model { font-size: 12px; font-weight: 600; }
  #drawer p { margin: 10px 0; opacity: .9; } #drawer h4 { margin: 16px 0 6px; font-size: 10.5px; letter-spacing: .14em; opacity: .6; font-weight: 700; }
  #drawer .links { display: flex; flex-wrap: wrap; gap: 6px; }
  #drawer .links button, #drawer .act { font: 600 12px var(--font); padding: 5px 10px; border-radius: 5px; cursor: pointer; border: 1px solid #2c3b55;
                                        background: #121a29; color: #cfe0ff; } #drawer .links button:hover, #drawer .act:hover { border-color: #4f7cc0; color: #fff; }
  #drawer .act { margin-top: 4px; padding: 7px 12px; }
  #drawer .cmd { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.35); margin: 8px 0; }
  #drawer .cmd code { flex: 1; } #drawer .cmd .act { margin: 0; flex: none; } #drawer a { color: #7ab8ff; }
  #drawer code { font: 11.5px var(--mono); opacity: .8; word-break: break-all; }
  #drawer .feed div { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05);
                      font-size: 12px; cursor: pointer; } #drawer .feed div:hover { background: rgba(255,255,255,.04); }
  #drawer .feed .who { font-weight: 700; } #drawer .feed .what { grid-column: 2; font: 11.5px var(--mono); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blueprint #drawer { background: rgba(14,20,32,.97); border: 1px solid #2c3b55; box-shadow: -8px 0 30px rgba(0,0,0,.45); color: #d8e1f0; }
  .factory #drawer { background: #33302c; border: 2px solid #1a1816; color: #e9dfcf; }
  button.chip { cursor: pointer; font: 600 11px var(--font); } button.chip:hover { filter: brightness(1.25); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; padding: 12px 28px 24px; opacity: .85; }
  .legend .lg { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 3px 7px; cursor: pointer; }
  .legend .lg:hover { border-color: #2c3b55; } .legend .lg.on { border-color: #4f7cc0; background: #1d2b44; color: #fff; }
  .legend .lg.clear { opacity: .7; text-decoration: underline; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .dim { opacity: .12; transition: opacity .15s; }
  .flow { animation: flow 1.1s linear infinite; } .flow.slow { animation-duration: 2.2s; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .live .edge:not(.active) .flow { animation: none; opacity: 0; }
  .live .edge.active .flow { animation-duration: .55s; }
  .live .edge.active path:nth-child(2) { stroke-opacity: 1; stroke-width: 2.4; }
  .status-working .glow { animation: pulse 1.1s ease-in-out infinite; } .status-working .sdot { animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  body.clean #drawer, body.clean #stats, body.clean #zoom, body.clean #search, body.clean #hits, body.clean #hint, body.clean .ctl { display: none !important; }
  body.still .flow, body.still .glow, body.still .sdot { animation: none !important; }
  @media (prefers-reduced-motion: reduce) { .flow, .glow, .sdot { animation: none !important; } }

  body.blueprint { background-color: #0a0e15; color: #d8e1f0;
    background-image: linear-gradient(rgba(120,160,220,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(120,160,220,.07) 1px, transparent 1px),
                      linear-gradient(rgba(120,160,220,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(120,160,220,.025) 1px, transparent 1px);
    background-size: 160px 160px, 160px 160px, 20px 20px, 20px 20px; }
  .blueprint .ctl button { color: #9fb6d8; border-color: #2c3b55; } .blueprint .ctl button.on { background: #1d2b44; color: #fff; border-color: #4f7cc0; }
  .blueprint .chip { background: #121a29; border: 1px solid #263552; color: #b9c7de; }
  .blueprint .col { fill: #6f86ab; font: 600 11px var(--font); letter-spacing: .18em; }

  body.factory { background-color: #262320; color: #e9dfcf;
    background-image: linear-gradient(rgba(0,0,0,.28) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.28) 2px, transparent 2px),
                      radial-gradient(circle at 30% 20%, rgba(255,200,120,.05), transparent 60%), radial-gradient(circle at 80% 90%, rgba(0,0,0,.25), transparent 50%);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%; }
  .factory h1 { text-transform: uppercase; letter-spacing: .12em; color: #ffcc66; }
  .factory .ctl button { color: #e9dfcf; border-color: #5a524a; background: #3a3530; } .factory .ctl button.on { background: #e39827; color: #1b1712; border-color: #ffbf55; }
  .factory .chip { background: #3a3530; border: 1px solid #1a1816; color: #e9dfcf; border-radius: 3px; }
  .factory .col { fill: #c9a26a; font: 700 11px var(--font); letter-spacing: .2em; }
</style></head>
<body class="blueprint">
<header>
  <div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
  <div id="stats"></div>
  <div class="ctl"><span id="hits"></span><input id="search" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search the map"><button id="motion">Motion</button></div>
</header>
<div id="wrap"><svg id="map"></svg><div id="crumbs"></div><div id="tools" role="toolbar"></div><aside id="drawer" aria-label="Details"></aside><span id="hint">drag to move · pinch or Ctrl+scroll to zoom</span><div id="zoom"><button data-z="in" title="Zoom in">+</button><button data-z="out" title="Zoom out">−</button><button data-z="fit" title="Show the whole map">⤢</button></div></div>
<div class="legend" id="legend"></div>
<script>
const MAP = /*MAP_DATA*/null;
const KINDS = {   // kind: [label, blueprint colour, factory colour, icon]
  input:  ["input / source", "#b48cff", "#9c7bd1", "▶"],  script: ["script (free)", "#5fe08a", "#7fb04a", "⚙"],
  agent:  ["model agent (tokens)", "#4da3ff", "#4aa3df", "◆"], human: ["you", "#ffb547", "#f2b134", "●"],
  file:   ["file / contract", "#8b97ad", "#8f8478", "▤"],  output: ["output", "#3fd9e6", "#d9774a", "■"],
  service:["service / timer", "#f06fb0", "#c75b8f", "⏻"], module: ["app code", "#ff8f6b", "#d9774a", "▣"],
};
const EDGES = { data: ["data", "#5fe08a", "#e8c547"], control: ["control", "#4da3ff", "#d9534f"],
                human: ["you act", "#ffb547", "#f2b134"], feedback: ["feedback", "#b48cff", "#4aa3df"] };
const STATUS = { working: "#5fe08a", waiting: "#ffb547", failed: "#ff5c6c", done: "#4da3ff", idle: "#56607a" };
const U = 20, W = 220, H = 80, HEAD = 24, G = 10, PAD = 40;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("map");
const el = (t, a = {}, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ---------------- placement: free grid (x, y in 20 px units) or the older columns/rows ----------------
let nodes, edges, byId, free, groups, VW, VH, LEVEL = MAP;
const stack = [];                                        // maps we zoomed out of: [{level, view, title}]
const topById = Object.fromEntries(MAP.nodes.map(n => [n.id, n]));
function autoLayout() {                                  // inner maps may leave out x/y: columns by kind, wrapped at 6
  const order = ["input", "service", "script", "module", "human", "agent", "file", "output"];
  const inside = nodes.filter(n => !n.outside), outIn = nodes.filter(n => n.outside && edges.some(e => e.from === n.id)),
        outOut = nodes.filter(n => n.outside && !outIn.includes(n));
  const cols = [outIn, ...order.map(k => inside.filter(n => n.kind === k)), outOut].filter(c => c.length);
  let x = 0;
  for (const ns of cols) { const per = Math.ceil(ns.length / Math.ceil(ns.length / 5));
    ns.forEach((n, i) => { n.x = x + Math.floor(i / per) * 17; n.y = 2 + (i % per) * 8; });
    x += Math.ceil(ns.length / per) * 17 + 6; }
  free = true;
}
function load(M) {
  LEVEL = M;
  nodes = M.nodes.map(n => ({ ...n })); byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  edges = M.edges.map(e => Array.isArray(e) ? { from: e[0], to: e[1], kind: e[2] || "data", label: e[3] } : { kind: "data", ...e });
  free = nodes.every(n => n.x !== undefined && n.y !== undefined);
  if (!free && !M.columns) autoLayout();
  if (!free) {
    const cols = M.columns.map((_, c) => nodes.filter(n => n.col === c));
    if (!nodes.every(n => n.row !== undefined)) {
      cols.forEach(cn => cn.forEach((n, i) => n._r = i));
      for (let it = 0; it < 6; it++) cols.forEach(cn => {
        cn.forEach(n => { const nb = edges.filter(e => e.from === n.id || e.to === n.id).map(e => byId[e.from === n.id ? e.to : e.from]).filter(m => m.col !== n.col);
                          n._k = nb.length ? nb.reduce((s, m) => s + m._r, 0) / nb.length : n._r; });
        cn.sort((a, b) => a._k - b._k).forEach((n, i) => n._r = i);
      });
    } else nodes.forEach(n => n._r = n.row);
    nodes.forEach(n => { n.x = 2 + n.col * 16; n.y = 4 + n._r * 5; });
  }
  nodes.forEach(n => { n.px = n.x * U; n.py = n.y * U; });
  groups = (M.groups || []).map((g, i) => { const ms = g.nodes.map(id => byId[id]);
    return { ...g, i, x: Math.min(...ms.map(m => m.px)) - 20, y: Math.min(...ms.map(m => m.py)) - 34, x2: Math.max(...ms.map(m => m.px + W)) + 20, y2: Math.max(...ms.map(m => m.py + H)) + 20 }; });
  { // shift everything so the drawing starts at the margin
    const top = !free && M.columns ? 30 : 0;
    const mx = Math.min(...nodes.map(n => n.px), ...groups.map(g => g.x)), my = Math.min(...nodes.map(n => n.py), ...groups.map(g => g.y));
    const dx = Math.round((PAD - mx) / G) * G, dy = Math.round((PAD + top - my) / G) * G;   // keep boxes on the routing grid: no slanted wire ends
    nodes.forEach(n => { n.px += dx; n.py += dy; }); groups.forEach(g => { g.x += dx; g.x2 += dx; g.y += dy; g.y2 += dy; });
  }
  nodes.forEach(n => n.gmask = groups.filter(g => g.nodes.includes(n.id)).reduce((m, g) => m | (1 << g.i), 0));
  VW = Math.max(...nodes.map(n => n.px + W), ...groups.map(g => g.x2)) + PAD;
  VH = Math.max(...nodes.map(n => n.py + H), ...groups.map(g => g.y2)) + PAD;
  routeAll();
}

// ---------------- routing: orthogonal paths on a 10 px lattice that go around boxes ----------------
// Cost: length, +6 per bend, +4 for running on top of another wire, +1.5 for crossing one,
// +2 per step inside a zone that neither end belongs to (keeps zones readable).
function routeAll() {
  const C = Math.floor(VW / G) + 1, R = Math.floor(VH / G) + 1, N = C * R, id = (i, j) => j * C + i;
  const blocked = new Uint8Array(N), gm = new Int32Array(N), useH = new Uint8Array(N), useV = new Uint8Array(N);
  for (const n of nodes) for (let i = Math.ceil((n.px - 8) / G); i <= Math.floor((n.px + W + 8) / G); i++)
    for (let j = Math.ceil((n.py - 8) / G); j <= Math.floor((n.py + H + 8) / G); j++) if (i >= 0 && j >= 0 && i < C && j < R) blocked[id(i, j)] = 1;
  for (const g of groups) for (let i = Math.ceil(g.x / G); i <= Math.floor(g.x2 / G); i++)
    for (let j = Math.ceil(g.y / G); j <= Math.floor(g.y2 / G); j++) if (i >= 0 && j >= 0 && i < C && j < R) gm[id(i, j)] |= 1 << g.i;
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  const edgeZ = new Uint8Array(N);   // lattice points on or next to a zone border: wires should cross it, not run along it
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) { const q = id(i, j);
    for (let d = 0; d < 4; d++) { const ii = i + DX[d] * 1, jj = j + DY[d] * 1;
      if (ii >= 0 && jj >= 0 && ii < C && jj < R && gm[id(ii, jj)] !== gm[q]) { edgeZ[q] = 1; break; } } }
  // sides: 0 right, 1 bottom, 2 left, 3 top; horizontal when the boxes are clearly side by side
  const sideOf = (n, m) => { const dx = (m.px - n.px), dy = (m.py - n.py); return Math.abs(dx) >= W * 0.8 ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3); };
  const slots = {};
  edges.forEach(e => { const a = byId[e.from], b = byId[e.to]; e.sa = sideOf(a, b); e.sb = sideOf(b, a);
    (slots[a.id + e.sa] ||= []).push([e, "a", b]); (slots[b.id + e.sb] ||= []).push([e, "b", a]); });
  for (const k in slots) {
    const list = slots[k], s = k.slice(-1) | 0, n = byId[k.slice(0, -1)], vert = s === 0 || s === 2;
    list.sort((p, q) => vert ? p[2].py - q[2].py : p[2].px - q[2].px);
    list.forEach(([e, end], i) => {
      const t = (i + 1) / (list.length + 1);
      const x = s === 0 ? n.px + W : s === 2 ? n.px : n.px + Math.round(t * W / G) * G;
      const y = s === 1 ? n.py + H : s === 3 ? n.py : n.py + Math.round((12 + t * (H - 24)) / G) * G;
      e["p" + end] = [x, y]; e["s" + end + "pt"] = [x + DX[s] * 2 * G, y + DY[s] * 2 * G];
    });
  }
  // facing sides: put both ends on one line when the boxes overlap, so the wire can run straight
  const snap = v => Math.round(v / G) * G;
  for (const e of edges) {
    if ((e.sa + 2) % 4 !== e.sb) continue;
    const a = byId[e.from], b = byId[e.to], horiz = e.sa % 2 === 0, k = horiz ? 1 : 0;
    const range = n => horiz ? [n.py + 12, n.py + H - 12] : [n.px + 20, n.px + W - 20];
    const one = (n, sd) => slots[n.id + sd].length === 1;
    const [ra, rb] = [range(a), range(b)], lo = Math.max(ra[0], rb[0]), hi = Math.min(ra[1], rb[1]);
    if (lo > hi) continue;
    const fix = (end, v, sd) => { e["p" + end][k] = v; e["s" + end + "pt"] = [e["p" + end][0] + DX[sd] * 2 * G, e["p" + end][1] + DY[sd] * 2 * G]; };
    const pa = e.pa[k], pb = e.pb[k];
    if (pa === pb) continue;
    if (one(b, e.sb) && pa >= rb[0] && pa <= rb[1]) fix("b", pa, e.sb);
    else if (one(a, e.sa) && pb >= ra[0] && pb <= ra[1]) fix("a", pb, e.sa);
    else if (one(a, e.sa) && one(b, e.sb)) { const v = snap((lo + hi) / 2); fix("a", v, e.sa); fix("b", v, e.sb); }
  }
  const dist = new Float64Array(N * 4), prev = new Int32Array(N * 4);
  function astar(e) {
    const a = byId[e.from], b = byId[e.to], allow = a.gmask | b.gmask;
    const si = Math.round(e.sapt[0] / G), sj = Math.round(e.sapt[1] / G), ti = Math.round(e.sbpt[0] / G), tj = Math.round(e.sbpt[1] / G);
    const start = id(si, sj), goal = id(ti, tj), inward = (e.sb + 2) % 4;
    dist.fill(Infinity); prev.fill(-1);
    const heap = []; const push = (f, s) => { heap.push([f, s]); let c = heap.length - 1; while (c) { const p = (c - 1) >> 1; if (heap[p][0] <= heap[c][0]) break; [heap[p], heap[c]] = [heap[c], heap[p]]; c = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let c = 0; for (;;) { const l = 2 * c + 1, r = l + 1; let m = c;
      if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === c) break; [heap[m], heap[c]] = [heap[c], heap[m]]; c = m; } } return top; };
    const s0 = start * 4 + e.sa; dist[s0] = 0; push(0, s0);

function closeDrawer() { drawer.classList.remove("on"); drawerMode = null; if (pinned) { const n = byId[pinned]; if (n) refreshTools(n); } }

function linkBtns(ids) { return `<div class="links">${ids.map(id => `<button data-go="${esc(id)}">${esc(byId[id].title)}</button>`).join("")}</div>`; }
function openDetails(n) {
  drawerMode = "node"; const keep = drawer.scrollTop, same = drawer.dataset.id === n.id; drawer.dataset.id = n.id;
  const C = KINDS[n.kind][theme === "factory" ? 2 : 1], st = last?.nodes?.[n.id];
  const inn = [...new Set(edges.filter(e => e.to === n.id).map(e => e.from))], out = [...new Set(edges.filter(e => e.from === n.id).map(e => e.to))];
  drawer.innerHTML = `<button class="x" title="Close (Esc)">×</button>
    <div class="kind" style="color:${C}">${esc(KINDS[n.kind][0])}${n.outside ? " · outside this box" : ""}</div><h2>${esc(n.title)}</h2>
    ${n.model ? `<div class="model" style="color:${C}">${esc(n.model)}</div>` : ""}
    <p>${esc(n.detail || n.sub || "")}</p>
    ${n.kids ? `<button class="act" data-open>Open ▸ ${n.kids} parts inside</button>` : ""}
    ${(() => { const r = reach(n.id); return r.up.size || r.down.size ? `<h4>REACH</h4><div>affects <b>${r.down.size}</b> box${r.down.size === 1 ? "" : "es"} downstream · depends on <b>${r.up.size}</b> upstream</div>
      <button class="act" data-trace>${traceId === n.id ? "Stop trace" : "Trace on the map"}</button>` : ""; })()}
    ${st ? `<h4>NOW</h4><div><b style="color:${STATUS[st.status] || STATUS.idle}">● ${esc(st.status)}</b> ${esc(st.line)}</div>${st.detail ? `<p style="white-space:pre-line;font-size:12px">${esc(st.detail)}</p>` : ""}` : ""}
    ${inn.length ? `<h4>GETS FROM</h4>${linkBtns(inn)}` : ""}${out.length ? `<h4>FEEDS INTO</h4>${linkBtns(out)}` : ""}
    ${n.source && n.source.length ? `<h4>SOURCE</h4>${n.source.slice(0, 12).map(x => `<div><code>${esc(x)}</code></div>`).join("")}` : ""}`;
  drawer.querySelector(".x").onclick = () => closeDrawer();
  drawer.querySelector("[data-open]")?.addEventListener("click", () => enter(n));
  drawer.querySelector("[data-trace]")?.addEventListener("click", () => { traceId === n.id ? clearTrace() : trace(n); openDetails(n); });
  drawer.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const m = byId[b.dataset.go]; jump(m); select(m); });
  drawer.classList.add("on"); drawer.scrollTop = same ? keep : 0; refreshTools(n);
}
function liveChip() {
  const t = last?.totals || {};
  return last ? `<button class="chip" id="livechip" title="Show the activity feed"><span class="dot" style="background:${t.working ? STATUS.working : STATUS.idle}"></span>LIVE · <b>${t.working || 0}</b> working · activity</button>`
              : `<button class="chip" id="livechip" title="Open this map on the live board"><span class="dot" style="background:${STATUS.working}"></span>Live view →</button>`;
}
const BOARD = MAP._board || { project: "", cmd: "python3 board.py --open" };
const liveUrl = `http://127.0.0.1:8765/${encodeURIComponent(BOARD.project)}/`;
async function boardUp() {                               // works from a file:// page too (opaque reply = something answers)
  try { const c = new AbortController(); setTimeout(() => c.abort(), 900);
        await fetch("http://127.0.0.1:8765/", { mode: "no-cors", cache: "no-store", signal: c.signal }); return true; } catch (_) { return false; }
}
async function toggleActivity() {
  if (drawerMode === "activity") return closeDrawer();
  if (!last && await boardUp()) { location.href = liveUrl; return; }   // board running: go straight to the live map
  openActivity();
}
function copyText(text, btn) {
  const done = () => { btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy", 1600); };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done, () => fallback());
  fallback();
  function fallback() { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); done(); } catch (_) { btn.textContent = "Select and copy"; } t.remove(); }
}
function openActivity() {
  drawerMode = "activity"; drawer.dataset.id = "";
  let body;
  if (!last) {
    body = `<p>The live board shows this map with working boxes glowing, each agent's current step and an activity feed.
      It is not running right now. Paste this in a terminal; it starts the board and opens this map:</p>
      <div class="cmd"><code>${esc(BOARD.cmd)}</code><button class="act" data-copy>Copy</button></div>
      <p>Afterwards the map is always at <a href="${liveUrl}">${esc(liveUrl.replace("http://", ""))}</a>, worth a bookmark.
      This button then takes you straight there.</p>`;
  } else {
    const title = id => topById[id]?.title || id;
    body = (last.feed || []).slice(0, 40).map(f => `<div data-node="${esc(f.node)}"><span style="opacity:.6">${new Date(f.t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false })}</span>` +
      `<span class="who" style="color:${topById[f.node] ? KINDS[topById[f.node].kind][theme === "factory" ? 2 : 1] : "#8b97ad"}">${esc(title(f.node))}</span>` +
      `<span class="what" title="${esc(f.text)}">${esc(f.text)}</span></div>`).join("") || `<p style="opacity:.6">Nothing in the last 24 hours.</p>`;
    body = `<div class="feed">${body}</div>`;
  }
  const keep = drawer.scrollTop;
  drawer.innerHTML = `<button class="x" title="Close (Esc)">×</button><div class="kind" style="color:${STATUS.working}">live view</div><h2>${last ? "Activity" : "Start the live view"}</h2>${body}`;
  drawer.querySelector(".x").onclick = () => closeDrawer();
  drawer.querySelector("[data-copy]")?.addEventListener("click", e => copyText(BOARD.cmd, e.currentTarget));
  drawer.querySelectorAll(".feed [data-node]").forEach(d => d.onclick = () => { const m = byId[d.dataset.node]; if (m) { jump(m); select(m); } });
  drawer.classList.add("on"); drawer.scrollTop = keep;
}

// ---------------- zoom into a box: open its inner map; breadcrumb, Backspace or Esc to go back ----------------
function crumbs() {
  const c = document.getElementById("crumbs");
  if (!stack.length) { c.innerHTML = ""; return; }
  c.innerHTML = stack.map((s, i) => `<button data-up="${stack.length - i}">${esc(s.title)}</button><span>›</span>`).join("") + `<b>${esc(LEVEL.title)}</b>`;
  c.querySelectorAll("button").forEach(b => b.onclick = e => { e.stopPropagation(); up(+b.dataset.up); });
}
const kindFilter = new Set(), edgeFilter = new Set();
document.getElementById("legend").addEventListener("click", e => {
  const b = e.target.closest(".lg"); if (!b) return;
  if (b.dataset.clear !== undefined) { kindFilter.clear(); edgeFilter.clear(); }
  else { const set = b.dataset.k ? kindFilter : edgeFilter, k = b.dataset.k || b.dataset.e; set.has(k) ? set.delete(k) : set.add(k); }
  render(theme); svg.querySelectorAll(".dim").forEach(x => x.classList.remove("dim")); applySearch();
});
let entering = false;
function enter(n) {
  if (entering) return; entering = true; select(null);
  const back = { level: LEVEL, view: { ...view }, title: LEVEL.title || MAP.title };
  crossFade(() => {
    stack.push(back); traceId = null; kindFilter.clear(); edgeFilter.clear(); load({ ...n.inner, title: n.title });
    sbox.value = ""; hitAt = -1; render(theme); fit(); crumbs(); entering = false;
  });
}
function crossFade(swap) {                               // fade out, swap the drawing, fade in
  const still = document.body.classList.contains("still") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) return swap();
  svg.classList.add("fade");
  setTimeout(() => { swap(); requestAnimationFrame(() => svg.classList.remove("fade")); setTimeout(() => svg.classList.remove("fade"), 60); }, 160);
}
function up(k = 1) {
  if (!stack.length) return;
  let s; for (let i = 0; i < k && stack.length; i++) s = stack.pop();
  select(null);
  crossFade(() => { traceId = null; kindFilter.clear(); edgeFilter.clear(); load(s.level); sbox.value = ""; hitAt = -1; render(theme); Object.assign(view, s.view); applyView(); crumbs(); });
}
document.addEventListener("keydown", e => {
  if (document.activeElement === sbox) return;
  if (e.key === "Enter" && pinned) { e.preventDefault(); mainAction(byId[pinned]); return; }
  if (e.key === "Escape" && drawer.classList.contains("on")) { closeDrawer(); return; }
  if (e.key === "Escape" && traceId) { clearTrace(); refreshTools(byId[pinned] || {}); return; }
  if (e.key === "Escape" && pinned) { select(null); clearHover(); return; }
  if ((e.key === "Backspace" || e.key === "Escape") && stack.length) { e.preventDefault(); up(); }
});
// ---------------- search: title, text, model, id; Enter jumps to the next hit, Esc clears, "/" focuses ----------------
const sbox = document.getElementById("search"), hitsEl = document.getElementById("hits");
let hits = [], hitAt = -1;
function applySearch() {                                // search + legend filter together
  const q = sbox.value.trim().toLowerCase();
  const kindOk = n => !kindFilter.size || kindFilter.has(n.kind);
  hits = q ? nodes.filter(n => kindOk(n) && [n.title, n.sub, n.detail, n.model, n.id, KINDS[n.kind][0]].join(" ").toLowerCase().includes(q)) : [];
  const set = new Set(hits.map(n => n.id)), filtering = q || kindFilter.size || edgeFilter.size;
  const shown = id => kindOk(byId[id]) && (!q || set.has(id));
  svg.querySelectorAll(".node").forEach(x => { x.classList.toggle("hit", set.has(x.dataset.id)); if (filtering) x.classList.toggle("dim", !shown(x.dataset.id)); });
  edges.forEach(e => { if (filtering) e._g.classList.toggle("dim", !(shown(e.from) && shown(e.to) && (!edgeFilter.size || edgeFilter.has(e.kind)))); });
  hitsEl.textContent = q ? (hitAt >= 0 && hits.length ? `${hitAt + 1}/${hits.length}` : `${hits.length} found`) : "";
  sbox.classList.toggle("none", !!q && !hits.length);
}
function jump(n) {
  view.s = Math.max(view.s, Math.min(1, fitScale() * 2.2)); view.fitted = false;
  view.x = n.px + W / 2 - wrap.clientWidth / view.s / 2; view.y = n.py + H / 2 - wrap.clientHeight / view.s / 2; applyView();
}
sbox.addEventListener("input", () => { hitAt = -1; applySearch(); });
sbox.addEventListener("keydown", e => {
  if (e.key === "Escape") { sbox.value = ""; hitAt = -1; clearHover(); sbox.blur(); return; }
  if (e.key !== "Enter" || !hits.length) return;
  e.preventDefault(); hitAt = (hitAt + (e.shiftKey ? hits.length - 1 : 1)) % hits.length;
  const n = hits[hitAt]; jump(n); select(n); applySearch(); svg.querySelector(`.node[data-id="${CSS.escape(n.id)}"]`).classList.remove("dim");
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== sbox) { e.preventDefault(); sbox.focus(); } });
function hover(n) {
  const near = new Set([n.id]);
  svg.querySelectorAll(".edge").forEach(p => { const on = p.dataset.from === n.id || p.dataset.to === n.id;
    p.classList.toggle("dim", !on); if (on) { near.add(p.dataset.from); near.add(p.dataset.to); } });
  svg.querySelectorAll(".node").forEach(x => x.classList.toggle("dim", !near.has(x.dataset.id)));
}

// ---------------- pan and zoom: drag with mouse or finger, pinch / Ctrl+wheel / buttons to zoom ----------------
const wrap = document.getElementById("wrap");
const view = { x: 0, y: 0, s: 1, fitted: true };        // s = screen pixels per map pixel
const pts = new Map(); let moved = 0, dragged = false, pinch = null, pinned = null;
function fitScale() { return Math.min(wrap.clientWidth / VW, wrap.clientHeight / VH); }
function sizeWrap() {
  const w = wrap.clientWidth;
  wrap.style.height = Math.round(w < 760 ? window.innerHeight * 0.78 : Math.max(420, Math.min(VH * w / VW, window.innerHeight - wrap.getBoundingClientRect().top - 56))) + "px";
}
function applyView() {
  const vw = wrap.clientWidth / view.s, vh = wrap.clientHeight / view.s;
  view.x = VW <= vw ? (VW - vw) / 2 : Math.min(Math.max(view.x, 0), VW - vw);
  view.y = VH <= vh ? (VH - vh) / 2 : Math.min(Math.max(view.y, 0), VH - vh);
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${vw} ${vh}`);
  if (typeof placeTools === "function") placeTools();
}
function fit() { view.s = fitScale(); view.x = view.y = 0; view.fitted = true; applyView(); }
function zoomAt(f, cx, cy) {                            // cx, cy: point in the frame that stays put
  const s = Math.min(3, Math.max(fitScale(), view.s * f)), mx = view.x + cx / view.s, my = view.y + cy / view.s;
  view.s = s; view.x = mx - cx / s; view.y = my - cy / s; view.fitted = false; applyView();
}
wrap.addEventListener("pointerdown", e => {
  if (!pts.size) { moved = 0; dragged = false; }
  if (e.target.closest("#zoom, #drawer, #tools, #crumbs")) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
});
wrap.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const [px, py] = pts.get(e.pointerId), dx = e.clientX - px, dy = e.clientY - py;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 5) {
      if (!dragged) { dragged = true; wrap.classList.add("drag"); try { wrap.setPointerCapture(e.pointerId); } catch (_) {} }
      view.x -= dx / view.s; view.y -= dy / view.s; view.fitted = false; applyView();
    }
  } else if (pts.size === 2) {
    dragged = true;
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = wrap.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    pinch = d;
  }
});
const lift = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) wrap.classList.remove("drag"); };
wrap.addEventListener("pointerup", lift); wrap.addEventListener("pointercancel", lift);
wrap.addEventListener("click", e => { if (dragged && !e.target.closest("#zoom, #drawer, #tools")) { e.stopPropagation(); e.preventDefault(); } dragged = false; }, true);
svg.addEventListener("click", e => { if (!e.target.closest(".node") && !dragged) { select(null); clearHover(); } });
wrap.addEventListener("wheel", e => {                   // plain scrolling keeps scrolling the page
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); const r = wrap.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.004), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
document.querySelectorAll("#zoom button").forEach(b => b.onclick = () => b.dataset.z === "fit" ? fit()
  : zoomAt(b.dataset.z === "in" ? 1.3 : 1 / 1.3, wrap.clientWidth / 2, wrap.clientHeight / 2));
window.addEventListener("resize", () => { sizeWrap(); view.fitted ? fit() : applyView(); });

// ---------------- live mode: poll status.json from the board server ----------------
function driftChip(d) {
  if (!d || !d.count) return "";
  const t = [...(d.stale || []).map(x => "gone: " + x), ...(d.new || []).map(x => "new: " + x)].join("\n");
  return `<span class="chip" title="${esc(t)}" style="border-color:#ff5c6c;color:#ffb3ba"><span class="dot" style="background:#ff5c6c"></span>map out of date · <b>${d.count}</b></span>`;
}
function apply(s) {
  last = s; document.body.classList.add("live");
  for (const n of nodes) {
    const st = s.nodes[n.id] || { status: "idle", line: "" };
    n._g.classList.remove(...[...n._g.classList].filter(c => c.startsWith("status-"))); n._g.classList.add(`status-${st.status}`);
    n._dot.setAttribute("fill", STATUS[st.status] || STATUS.idle); n._dot.setAttribute("opacity", 1);
    const line = st.line || ""; n._live.textContent = line.length > 36 ? line.slice(0, 35) + "…" : line;
    n._live.setAttribute("fill", st.status === "idle" ? (theme === "factory" ? "#a89a86" : "#5f7090") : STATUS[st.status]);
    const glow = n._g.querySelector(".glow");
    if (glow) { glow.setAttribute("opacity", st.status === "working" ? .85 : theme === "factory" ? 0 : .2); if (theme !== "factory") glow.setAttribute("stroke", st.status === "working" ? STATUS.working : KINDS[n.kind][1]); }
  }
  edges.forEach(e => { const a = s.nodes[e.from]?.status, b = s.nodes[e.to]?.status; e._g.classList.toggle("active", a === "working" || b === "working"); });
  const t = s.totals || {};
  document.getElementById("stats").innerHTML = liveChip() +
    (t.cost_today !== undefined ? `<span class="chip">today ≈ <b>$${t.cost_today.toFixed(2)}</b></span>` : "") +
    (t.other_active ? `<span class="chip">${t.other_active} other session(s) active</span>` : "") + driftChip(t.drift || MAP.drift);
  if (drawerMode === "activity") openActivity();
  else if (drawerMode === "node" && pinned && byId[pinned]) openDetails(byId[pinned]);
}
let everLive = false;
async function poll() {
  try { const r = await fetch("status.json", { cache: "no-store" }); if (!r.ok) throw new Error(r.status);
        const d = await r.json(); if (!d || !d.nodes) throw new Error("not a board"); everLive = true; apply(d); }
  catch (err) {
    if (!everLive) return;                               // served by something else (editor preview, file server): stay a static map
    document.getElementById("stats").innerHTML = `<span class="chip"><span class="dot" style="background:${STATUS.failed}"></span>board stopped · last data ${new Date(last.time * 1000).toLocaleTimeString([], { hour12: false })}</span>`;
  }
  setTimeout(poll, 3000);
}

document.getElementById("title").textContent = MAP.title;
document.getElementById("subtitle").textContent = MAP.subtitle || "";
document.title = MAP.title;
document.getElementById("motion").onclick = () => document.body.classList.toggle("still");
const clean = location.hash.includes("clean");   // #clean: map only, for screenshots
if (clean) document.body.classList.add("clean", "still");
sizeWrap();
if (wrap.clientWidth < 760) { view.s = 0.8; view.x = view.y = 0; view.fitted = false; } else { view.s = fitScale(); view.fitted = true; }
render(location.hash.includes("factory") || MAP.theme === "factory" ? "factory" : "blueprint");   // Factory look: only via #factory
document.getElementById("stats").innerHTML = liveChip() + driftChip(MAP.drift);
document.getElementById("stats").addEventListener("click", e => { if (e.target.closest("#livechip")) toggleActivity(); });
if (location.protocol.startsWith("http")) poll();
</script>
</body></html>
