name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }   # oldest supported (newer Ubuntu images no longer ship it)
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: python -m unittest discover -s tests -v
